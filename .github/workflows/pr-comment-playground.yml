name: Comment Playground Link

on:
  workflow_run:
    workflows: ['Build Live Branch']
    types:
      - completed

concurrency:
  group: playground-comment-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  comment:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Download PR metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: pr
        run: |
          echo "number=$(cat pr_number.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=$(cat commit_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Expose built artifact
        id: expose
        uses: WordPress/action-wp-playground-pr-preview/.github/actions/expose-artifact-on-public-url@06d6a7e5e287101f5a496ef3361aa07967448813 # v2.0.1
        with:
          artifact-name: remote-data-blocks-pr${{ steps.pr.outputs.number }}-${{ steps.pr.outputs.sha }}
          artifact-filename: remote-data-blocks.zip
          pr-number: ${{ steps.pr.outputs.number }}
          commit-sha: ${{ steps.pr.outputs.sha }}
          artifact-source-run-id: ${{ github.event.workflow_run.id }}
          artifacts-to-keep: '2'

      - name: Comment on PR with WordPress Playground link
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.expose.outputs.artifact-url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const prNumber = process.env.PR_NUMBER;
            const artifactUrl = process.env.ARTIFACT_URL;

            const blueprint = JSON.stringify({
              landingPage: '/wp-admin/admin.php?page=remote-data-blocks-settings',
              features: { networking: true },
              login: true,
              preferredVersions: { php: '8.2', wp: 'latest' },
              steps: [
                {
                  step: 'setSiteOptions',
                  options: {
                    blogname: `Remote Data Blocks PR#${prNumber}`,
                    blogdescription: 'Explore the Remote Data Blocks plugin in a WordPress Playground',
                  },
                },
                {
                  step: 'installPlugin',
                  pluginZipFile: {
                    resource: 'url',
                    url: artifactUrl,
                  },
                  options: {
                    activate: true,
                    targetFolderName: 'remote-data-blocks',
                  },
                },
              ],
            });

            const playgroundUrl = `https://playground.wordpress.net/#${blueprint}`;
            const body = `Test this PR in [WordPress Playground](${playgroundUrl}).`;

            const commentInfo = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(prNumber),
            };

            const comments = (await github.rest.issues.listComments(commentInfo)).data;
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes('Test this PR in')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: commentInfo.owner,
                repo: commentInfo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...commentInfo, body });
            }
