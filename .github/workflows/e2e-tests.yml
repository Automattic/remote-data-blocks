name: E2E Tests

on:
  # Run on all pull requests.
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            core: WordPress/WordPress#6.7
            php: '8.1'
            legacy: '1'
          - wordpress: latest-stable
            core: https://wordpress.org/latest.zip
            php: '8.3'
            legacy: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use desired version of NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Npm install
        env:
          # npm postinstall runs Composer; authenticate its GitHub archive downloads.
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
        run: |
          npm ci

      - name: Install Playwright dependencies
        run: |
          npx playwright install chromium --with-deps

      - name: Start up WordPress environment
        env:
          WP_ENV_CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: |
          npm run dev:build

      - name: Output WordPress and PHP version
        run: |
          npx wp-env run tests-cli wp cli info
          npx wp-env run tests-cli wp core version

      - name: Activate deterministic bindings fixture
        run: npx wp-env run tests-cli wp plugin activate bindings-demo

      - name: Run E2E tests
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          RDB_E2E_LEGACY: ${{ matrix.legacy }}
        run: |
          npm run test:e2e

      - name: Stop WordPress environment
        if: always()
        run: |
          npm run dev:stop

      - name: Archive E2E results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ matrix.wordpress }}
          path: artifacts
