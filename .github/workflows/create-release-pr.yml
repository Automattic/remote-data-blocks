name: Create release PR

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version component to bump (none keeps the current X.Y.Z)
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      release_channel:
        description: Release channel (alpha/beta numbers start at 1)
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha
          - beta

permissions:
  contents: write
  pull-requests: write

jobs:
  create_release_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.1'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        id: release
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          npm run release -- "$RELEASE_TYPE" "$RELEASE_CHANNEL"

          VERSION=$(sed -n 's/.*Version: *//p' remote-data-blocks.php | head -n1 | tr -d '[:space:]')
          BRANCH="release/v${VERSION}"

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        run: >
          git push --set-upstream origin
          "${{ steps.release.outputs.branch }}"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-pr-body.md <<'BODY'
          Prepares v${{ steps.release.outputs.version }} for review.

          Release type: ${{ inputs.release_type }}
          Release channel: ${{ inputs.release_channel }}
          Generated by: Create release PR workflow

          Merging this PR into trunk starts the release workflow, which creates
          the GitHub release. Only stable releases deploy to WordPress.org;
          alpha/beta releases are GitHub prereleases and do not replace latest.
          BODY

          gh pr create \
            --base trunk \
            --head "${{ steps.release.outputs.branch }}" \
            --title "v${{ steps.release.outputs.version }}" \
            --body-file release-pr-body.md
