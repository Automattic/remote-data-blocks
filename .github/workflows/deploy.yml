name: Deploy to WordPress.org
on:
  release:
    types: [published, released]
  # Allow manual triggering of the workflow.
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version to deploy, without the v prefix.'
        required: true
      ref:
        description: 'Git ref to build and deploy.'
        required: true

jobs:
  release:
    name: New release to WordPress.org
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine deploy version
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "DEPLOY_VERSION=${VERSION}" >> "$GITHUB_ENV"
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Build release artifact
        run: |
          npm ci
          npm run plugin-zip
          mkdir -p /tmp/remote-data-blocks-deploy
          unzip -q remote-data-blocks.zip -d /tmp/remote-data-blocks-deploy

      - name: Install SVN (Subversion)
        run: |
          sudo apt-get update
          sudo apt-get install subversion

      - name: Push to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: remote-data-blocks
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          VERSION: ${{ env.DEPLOY_VERSION }}
          BUILD_DIR: /tmp/remote-data-blocks-deploy/remote-data-blocks
