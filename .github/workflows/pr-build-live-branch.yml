name: Build Live Branch
on:
  pull_request:
    branches:
      - trunk
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'bin/**'
      - '**/tests/**'
      - '**/*.md'
      - '.github/**'
      - '!.github/workflows/pr-build-live-branch.yml'
      - '!.github/workflows/scripts/generate-playground-blueprint.js'

concurrency:
  # Cancel concurrent jobs on pull_request but not push, by including the run_id in the concurrency group for the latter.
  group: build-${{ github.event_name == 'push' && github.run_id || 'pr' }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

permissions: {}

jobs:
  build:
    if: github.repository_owner == 'Automattic' && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare plugin zips
        id: prepare
        env:
          ZIP_NAME: remote-data-blocks-${{ github.event.pull_request.number }}.zip
        run: |
          echo "Generating zip file..."
          cd "$GITHUB_WORKSPACE" || exit
          npm run plugin-zip
          mv remote-data-blocks.zip "$ZIP_NAME"
          mkdir "zips"
          mv "$ZIP_NAME" "zips/"
          mkdir -p "unzips/remote-data-blocks"
          cd "zips"
          unzip -qq "$ZIP_NAME"
          mv "$ZIP_NAME" "remote-data-blocks"
          mv "$GITHUB_WORKSPACE/zips/remote-data-blocks" "$GITHUB_WORKSPACE/unzips/remote-data-blocks/remote-data-blocks"

      - name: Create playground artifact
        id: create-playground-artifact-step
        uses: actions/upload-artifact@v4
        with:
          name: remote-data-blocks-${{ github.event.pull_request.number }}
          path: unzips/remote-data-blocks
          retention-days: 2
          if-no-files-found: 'error'
          overwrite: true

      - name: Output artifact ID
        run: echo 'Artifact ID is ${{ steps.create-playground-artifact-step.outputs.artifact-url }}'

      - name: Comment on PR with WordPress Playground details
        uses: actions/github-script@v7
        if: ! github.event.pull_request.head.repo.fork
        with:
          script: |
            const { run } = require('./.github/workflows/scripts/generate-playground-blueprint');
            run({ github, context, core, artifactUrl: ${{ steps.create-playground-artifact-step.outputs.artifact-url }} });
