name: Integration Tests

on:
  # Run on all pull requests.
  pull_request:
  push:
    branches:
      - trunk

permissions:
  contents: read

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.7'
            core: WordPress/WordPress#6.7
            php: '8.1'
            legacy: '1'
          - wordpress: latest-stable
            core: https://wordpress.org/latest.zip
            php: '8.3'
            legacy: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use desired version of NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Npm install
        run: npm ci

      - name: Start up WordPress environment
        env:
          WP_ENV_CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: npm run dev:build

      - name: Output WordPress and PHP version
        run: |
          npx wp-env run tests-cli wp cli info
          npx wp-env run tests-cli wp core version

      - name: Run Integration tests
        run: npm run test:integration
